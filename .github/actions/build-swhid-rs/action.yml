name: Build swhid-rs with cache
description: Build swhid-rs with split registry/target caching (matrix-safe)

inputs:
  rust:
    description: Rust toolchain channel (e.g., stable)
    required: true
  profile:
    description: Cargo build profile (release or debug)
    required: true
  features:
    description: Cargo feature list (e.g. "git")
    required: true

  repository:
    description: GitHub repository to checkout (owner/name)
    required: false
    default: swhid/swhid-rs

  ref:
    description: Git ref to checkout (branch/tag/sha)
    required: false
    default: main

  token:
    description: >
      GitHub token with read access to the repository.
      Optional for public repositories. If empty or not provided, uses GITHUB_TOKEN.
    required: false
    default: ""

runs:
  using: composite
  steps:
    # ------------------------------------------------------------
    # Deterministic build environment
    # ------------------------------------------------------------
    - name: Configure build environment
      shell: bash
      run: |
        echo "CARGO_TARGET_DIR=${{ runner.temp }}/cargo-target-swhid-rs" >> "$GITHUB_ENV"
        echo "SWHID_RS_PROFILE=${{ inputs.profile }}" >> "$GITHUB_ENV"
        echo "SWHID_RS_FEATURES=${{ inputs.features }}" >> "$GITHUB_ENV"

    # ------------------------------------------------------------
    # Rust toolchain fingerprint
    # ------------------------------------------------------------
    - name: Compute Rust toolchain hash
      shell: bash
      run: |
        echo "RUSTC_HASH=$(rustc -Vv | sha256sum | cut -d' ' -f1)" >> "$GITHUB_ENV"

    # ------------------------------------------------------------
    # Authenticated checkout (supports both public and private repos)
    # For public repos, GITHUB_TOKEN is sufficient (default)
    # For private repos, provide a token with read access
    # ------------------------------------------------------------
    - name: Checkout swhid-rs
      uses: actions/checkout@v4
      with:
        repository: ${{ inputs.repository }}
        ref: ${{ inputs.ref }}
        path: swhid-rs
        fetch-depth: 1
        # Use provided token or fall back to GITHUB_TOKEN (default)
        token: ${{ inputs.token != '' && inputs.token || github.token }}

    # ------------------------------------------------------------
    # Dependency fingerprint
    # ------------------------------------------------------------
    - name: Compute Cargo.lock hash
      shell: bash
      run: |
        cd swhid-rs
        if [ -f Cargo.lock ]; then
          echo "CARGO_LOCK_HASH=$(sha256sum Cargo.lock | cut -d' ' -f1)" >> "$GITHUB_ENV"
          echo "Cargo.lock found, hash computed"
        else
          # Generate Cargo.lock if it doesn't exist (libraries sometimes don't commit it)
          echo "Cargo.lock not found, generating it..."
          cargo generate-lockfile 2>&1 || echo "Warning: Could not generate Cargo.lock"
          if [ -f Cargo.lock ]; then
            echo "CARGO_LOCK_HASH=$(sha256sum Cargo.lock | cut -d' ' -f1)" >> "$GITHUB_ENV"
            echo "Cargo.lock generated, hash computed"
          else
            # Fallback: use a hash of Cargo.toml if Cargo.lock can't be generated
            echo "CARGO_LOCK_HASH=$(sha256sum Cargo.toml | cut -d' ' -f1)" >> "$GITHUB_ENV"
            echo "Using Cargo.toml hash as fallback"
          fi
        fi
        echo "CARGO_LOCK_HASH=${{ env.CARGO_LOCK_HASH }}"

    # ------------------------------------------------------------
    # System libraries fingerprint (libgit2, openssl paths/versions)
    # ------------------------------------------------------------
    - name: Compute system libraries hash
      shell: bash
      run: |
        SYS_LIBS=""
        if command -v pkg-config >/dev/null 2>&1; then
          for pkg in libgit2 openssl; do
            ver=$(pkg-config --modversion "$pkg" 2>/dev/null || echo "none")
            dir=$(pkg-config --variable=libdir "$pkg" 2>/dev/null || echo "none")
            SYS_LIBS="${SYS_LIBS}${pkg}:${ver}:${dir};"
          done
        fi
        if [ -z "$SYS_LIBS" ]; then
          SYS_LIBS="no-pkg-config"
        fi
        echo "SYS_LIBS_HASH=$(echo -n "$SYS_LIBS" | sha256sum | cut -d' ' -f1)" >> "$GITHUB_ENV"
        echo "System libs fingerprint: ${SYS_LIBS:0:80}..."

    # ------------------------------------------------------------
    # Cache 1: Cargo registry + git (download cache)
    # ------------------------------------------------------------
    - name: Cache Cargo registry and git
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
        key: cargo-registry-${{ runner.os }}-${{ env.RUSTC_HASH }}-${{ env.CARGO_LOCK_HASH }}
        restore-keys: |
          cargo-registry-${{ runner.os }}-${{ env.RUSTC_HASH }}-
          cargo-registry-${{ runner.os }}-

    # ------------------------------------------------------------
    # Cache 2: Rust target dir (compiled outputs, strict)
    # SYS_LIBS_HASH invalidates when libgit2/openssl version or path changes
    # ------------------------------------------------------------
    - name: Cache Rust target dir
      uses: actions/cache@v4
      with:
        path: ${{ env.CARGO_TARGET_DIR }}
        key: >
          swhid-rs-target-
          ${{ runner.os }}-
          ${{ inputs.rust }}-
          ${{ env.SWHID_RS_PROFILE }}-
          feat${{ env.SWHID_RS_FEATURES }}-
          ${{ env.RUSTC_HASH }}-
          ${{ env.CARGO_LOCK_HASH }}-
          ${{ env.SYS_LIBS_HASH }}
        restore-keys: |
          swhid-rs-target-${{ runner.os }}-${{ inputs.rust }}-${{ env.SWHID_RS_PROFILE }}-feat${{ env.SWHID_RS_FEATURES }}-${{ env.RUSTC_HASH }}-${{ env.CARGO_LOCK_HASH }}-${{ env.SYS_LIBS_HASH }}-
          swhid-rs-target-${{ runner.os }}-${{ inputs.rust }}-${{ env.SWHID_RS_PROFILE }}-feat${{ env.SWHID_RS_FEATURES }}-${{ env.RUSTC_HASH }}-${{ env.SYS_LIBS_HASH }}-
          swhid-rs-target-${{ runner.os }}-${{ inputs.rust }}-${{ env.SWHID_RS_PROFILE }}-feat${{ env.SWHID_RS_FEATURES }}-${{ env.SYS_LIBS_HASH }}-

    # ------------------------------------------------------------
    # Build
    # ------------------------------------------------------------
    - name: Build swhid-rs
      shell: bash
      run: |
        cd swhid-rs
        if [ "${{ inputs.profile }}" = "release" ]; then
          cargo build --release --features "${{ inputs.features }}"
        else
          cargo build --features "${{ inputs.features }}"
        fi
